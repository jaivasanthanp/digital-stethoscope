# =============================================================================
# Digital Stethoscope — STM32U575 Kconfig
# =============================================================================

# Console / logging
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# SAI audio (STM32U575 uses SAI, exposed via I2S API)
# The driver is CONFIG_I2S_STM32_SAI — selected automatically when
# I2S=y and the board has st,stm32-sai nodes in devicetree.
CONFIG_I2S=y
CONFIG_DMA=y

# CMSIS-DSP for STFT (arm_rfft_fast_f32, arm_dot_prod_f32, arm_mean_f32)
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_STATISTICS=y
CONFIG_CMSIS_DSP_BASICMATH=y
CONFIG_FPU=y

# C++ runtime — required by TFLite Micro (C++17, PICOLIBC default libc)
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# TFLite Micro — Phase 2: tflite-micro module fetched via west update
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y

# Stack and heap — Phase 2
# Tensor arena (100 KB) is statically allocated in inference.cc — not from heap.
# Heap covers Zephyr kernel + C++ runtime overhead only.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536

# Multi-threading
CONFIG_NUM_PREEMPT_PRIORITIES=16

# UART for BLE bridge / debug output
CONFIG_UART_INTERRUPT_DRIVEN=y

# Math functions (log10f, sqrtf) — provided by PICOLIBC (board default)
# CONFIG_NEWLIB_LIBC is NOT set — conflicts with the board's PICOLIBC choice
