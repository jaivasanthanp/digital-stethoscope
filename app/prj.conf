# =============================================================================
# Digital Stethoscope — STM32U575 Kconfig
# =============================================================================

# Console / logging
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_CONSOLE=y
# Console UART is binary-clean for the dashboard audio-upload protocol.
# Zephyr log text on the same UART corrupts the returned float32 spectrogram
# bytes, so CONFIG_LOG is not enabled.
# CONFIG_LOG is not set
# CONFIG_LOG_DEFAULT_LEVEL is not set

# Audio source
# Current revision: no ICS-43434 microphone. Synthetic PCG strings are rendered
# locally on the STM32U575 and fed into DSP + TFLite Micro.
# Re-enable I2S/DMA when a future SAI/I2S microphone source is added.
# CONFIG_I2S is not set
# CONFIG_DMA is not set

# CMSIS-DSP for STFT (arm_rfft_fast_f32, arm_dot_prod_f32, arm_mean_f32)
CONFIG_CMSIS_DSP=y
CONFIG_CMSIS_DSP_TRANSFORM=y
CONFIG_CMSIS_DSP_STATISTICS=y
CONFIG_CMSIS_DSP_BASICMATH=y
CONFIG_FPU=y

# C++ runtime — required by TFLite Micro (C++17, PICOLIBC default libc)
CONFIG_CPP=y
CONFIG_STD_CPP17=y

# TFLite Micro — Phase 2: tflite-micro module fetched via west update
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y

# Stack and heap — Phase 2
# Tensor arena (100 KB) is statically allocated in inference.cc — not from heap.
# Heap covers Zephyr kernel + C++ runtime overhead only.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536

# Multi-threading
CONFIG_NUM_PREEMPT_PRIORITIES=16

# UART for BLE bridge / debug output
CONFIG_UART_INTERRUPT_DRIVEN=y

# Large ring buffer support for the 40 KB audio-upload RX FIFO in validate.c.
CONFIG_RING_BUFFER_LARGE=y

# Math functions (log10f, sqrtf) — provided by PICOLIBC (board default)
# CONFIG_NEWLIB_LIBC is NOT set — conflicts with the board's PICOLIBC choice
