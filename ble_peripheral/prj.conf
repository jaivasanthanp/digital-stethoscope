# =============================================================================
# Digital Stethoscope — nRF52840 BLE peripheral Kconfig
# =============================================================================

# Console
CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="HeartSound"
CONFIG_BT_DEVICE_APPEARANCE=833

# GATT server
CONFIG_BT_GATT_CACHING=y
CONFIG_BT_GATT_NOTIFY_MULTIPLE=y
CONFIG_BT_ATT_PREPARE_COUNT=2

# UART — bidirectional with STM32U575:
#   RX: 6-byte classification packets back from STM32
#   TX: 'B' + 16 KB int16 PCM audio windows to STM32 (phone->BLE path)
CONFIG_UART_INTERRUPT_DRIVEN=y

# BLE Data Length Extension + large ATT MTU so the phone can write the
# 16 KB audio window efficiently. With ATT MTU 247 each WRITE_WITHOUT_RESPONSE
# carries up to 244 bytes of PCM (~66 writes per 2-second window).
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251
CONFIG_BT_CTLR_PHY_2M=y

# Minimal footprint
CONFIG_SIZE_OPTIMIZATIONS=y
